<div class="card">
    <h3>Add Expense</h3>

    <form method="post" class="form-row">
        {% csrf_token %}

        <div class="form-group">
            <label>Title</label>
            {{ form.title }}
        </div>

        <div class="form-group">
            <label>Amount</label>
            {{ form.amount }}
        </div>

        <div class="form-group">
            <label>Category</label>
            {{ form.category }}
        </div>

        <button type="submit" class="btn-primary">Add Expense</button>
    </form>
</div>
