{% extends 'base.html' %}

{% block content %}

<style>
    .login-container {
        width: 400px;
        margin: 80px auto;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        text-align: center;
    }

    .login-container h2 {
        margin-bottom: 25px;
        color: #333;
    }

    .input-group {
        text-align: left;
        margin-bottom: 15px;
    }

    .input-group label {
        font-weight: 500;
    }

    .input-group input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: 1px solid #ccc;
        outline: none;
    }

    .input-group input:focus {
        border-color: #4CAF50;
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #4CAF50, #2e7d32);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 15px;
    }

    .login-btn:hover {
        opacity: 0.9;
    }

    .error {
        color: red;
        margin-bottom: 10px;
    }
</style>

<div class="login-container">
    <h2>Login to Your Account</h2>

    {% if form.errors %}
        <p class="error">Invalid username or password</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="input-group">
            <label>Username</label>
            {{ form.username }}
        </div>

        <div class="input-group">
            <label>Password</label>
            {{ form.password }}
        </div>

        <button type="submit" class="login-btn">Login</button>
    </form>
</div>

{% endblock %}
