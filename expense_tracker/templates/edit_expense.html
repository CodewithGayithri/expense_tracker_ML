{% extends 'base.html' %}

{% block content %}

<style>
    .edit-container {
        width: 400px;
        margin: 60px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .edit-container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #2d3748;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-color: #4CAF50;
    }

    .update-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #4CAF50, #2e7d32);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }

    .update-btn:hover {
        opacity: 0.9;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        text-decoration: none;
        color: #2196F3;
    }
</style>

<div class="edit-container">

    <h2>Edit Expense</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Title</label>
            {{ form.title }}
        </div>

        <div class="form-group">
            <label>Amount</label>
            {{ form.amount }}
        </div>

        <div class="form-group">
            <label>Category</label>
            {{ form.category }}
        </div>

        <button type="submit" class="update-btn">Update Expense</button>
    </form>

    <a href="{% url 'dashboard' %}" class="back-link">← Back to Dashboard</a>

</div>

{% endblock %}
